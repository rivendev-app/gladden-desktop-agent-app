name: gladden
description: A multi-provider local AI desktop agent.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.1
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.0.0
  objectbox: ^5.2.0
  objectbox_flutter_libs: ^5.2.0
  path_provider: ^2.1.2
  flutter_markdown: ^0.7.7+1
  google_fonts: ^8.0.2
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  crypto: ^3.0.3
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.2.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  objectbox_generator: ^5.2.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
