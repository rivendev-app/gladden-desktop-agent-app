name: gladden
description: A multi-provider local AI desktop agent.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.1
  flutter_bloc: ^8.1.5
  flutter_secure_storage: ^9.0.0
  objectbox: ^2.5.0
  objectbox_flutter_libs: ^2.5.0
  path_provider: ^2.1.2
  flutter_markdown: ^0.6.18+4
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  crypto: ^3.0.3
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.2.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  objectbox_generator: ^2.5.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
