dev_dependencies:
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false
    image_path: "assets/images/app_icon.png"
    background_color: "#0F0F0F"
    theme_color: "#0F0F0F"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
